name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify demo runner
        run: dotnet run --project tests/SwiftSandbox.Tests.csproj -c Release
      - name: Build self-contained executable
        run: dotnet publish SwiftSandbox.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o release
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftSandbox-win-x64
          path: release/SwiftSandbox.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/SwiftSandbox.exe

